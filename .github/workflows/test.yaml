name: Test

on:
  push:

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
    -
      name: Check out code
      uses: actions/checkout@v5
    -
      name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
    -
      name: Go Test
      shell: bash
      env:
        GOFLAGS: -cover -coverprofile=coverage.out
      run: |
        make test
